spring.application.name=foodweb

#mangodb configuration

spring.data.mongodb.uri=${MONGO_URI}

#aws s3 configuration
aws.access.key=${AWS_ACCESS_KEY_ID}
aws.secret.key=${AWS_SECRET_ACCESS_KEY}
aws.region=eu-north-1
aws.s3.bucketName=${AWS_S3_BUCKET_NAME}




jwt.secret.key=${JWT_SECRET_KEY}

#stripe configuration
stripePublishableKey=${STRIPE_PUBLISHABLE_KEY}
stripeSecretKey=${STRIPE_SECRET_KEY}

spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
OPENAI_API_KEY=${OPENAI_API_KEY}


spring.autoconfigure.exclude=org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


#cors configuration (Frontend + Admin Panel), auf Railway per CORS_ALLOWED_ORIGINS ueberschreibbar
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://mohammadzein-flavorhaus.netlify.app,https://mohammadzein-flavorhaus-admin.netlify.app,http://localhost:5173,http://localhost:5174}

#admin: kommagetrennte E-Mails der Admin-Accounts (muessen registriert sein)
admin.emails=${ADMIN_EMAILS:}

#frontend url fuer Stripe success/cancel redirects
frontend.url=${FRONTEND_URL:https://mohammadzein-flavorhaus.netlify.app}

#stripe webhook (optional, Signing Secret aus dem Stripe Dashboard)
stripeWebhookSecret=${STRIPE_WEBHOOK_SECRET:}

#limit fuer KI-Kalorienberechnung (Anfragen pro Stunde)
nutrition.rate-limit.per-ip=${NUTRITION_LIMIT_PER_IP:20}
nutrition.rate-limit.global=${NUTRITION_LIMIT_GLOBAL:300}

#lieferkosten in Euro (muss zum Frontend passen)
order.shipping-fee=3.0
